<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hunter's Journal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
<header>
  <h1>Hunter's Journal</h1>
  <div id="xp-bar"><div id="xp-progress"></div></div>
  <div id="rank-display">Rank: E (Level 1)</div>
  <div id="daily-indicator" class="red">Behind Schedule</div>
</header>
<main>
  <section id="categories">
    <h2>Categories</h2>
    <ul id="category-list"></ul>
    <input id="new-category" placeholder="New category">
    <button id="add-category">Add Category</button>
  </section>
  <section id="quests">
    <h2>Quests</h2>
    <ul id="quest-list"></ul>
    <div class="add-quest">
      <input id="quest-name" placeholder="Quest name">
      <select id="quest-category"></select>
      <input id="quest-xp" type="number" placeholder="XP">
      <select id="quest-type">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>
      <button id="add-quest">Add Quest</button>
    </div>
  </section>
  <section id="achievements">
    <h2>Achievements</h2>
    <ul id="achievement-list"></ul>
  </section>
</main>

<section id="class-selection" class="modal hidden">
  <div class="modal-content">
    <h2>Select your Class</h2>
    <div id="class-options"></div>
  </div>
</section>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}</script>
<script src="app.js"></script>
</body>
</html>
